name: EAS build on env branches

on:
  push:
    branches:
      - testing
      - staging
      - prod
    paths:
      - "user-business-mobile/MobileApp/**"
      - ".github/workflows/eas-build.yml"

concurrency:
  group: eas-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  eas-build:
    name: EAS (${{ github.ref_name }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-business-mobile/MobileApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: user-business-mobile/MobileApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build testing (Android preview)
        if: github.ref_name == 'testing'
        run: eas build --profile preview --platform android --non-interactive --no-wait

      - name: Build staging (Android preview)
        if: github.ref_name == 'staging'
        run: eas build --profile preview --platform android --non-interactive --no-wait

      - name: Build staging (iOS TestFlight profile)
        if: github.ref_name == 'staging'
        continue-on-error: true
        run: eas build --profile preview-testflight --platform ios --non-interactive --no-wait

      - name: Build prod (production)
        if: github.ref_name == 'prod'
        run: eas build --profile production --platform all --non-interactive --no-wait
